[package]
name = "aetherion"
version = "0.1.0"
edition = "2024"
description = "Moteur de jeu CLI headless, déterministe et agent-native"
license = "MIT OR Apache-2.0"

[features]
default = []
display = []
plugin-runtime = ["dep:wasmi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wasmi = { version = "0.32.3", optional = true }

